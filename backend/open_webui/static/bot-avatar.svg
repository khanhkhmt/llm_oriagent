<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="60" cy="60" r="60" fill="url(#bg)"/>
  <!-- Antenna -->
  <line x1="60" y1="18" x2="60" y2="30" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <circle cx="60" cy="15" r="4" fill="white"/>
  <!-- Head -->
  <rect x="30" y="30" width="60" height="45" rx="12" fill="white"/>
  <!-- Eyes -->
  <circle cx="45" cy="50" r="6" fill="#6366f1"/>
  <circle cx="75" cy="50" r="6" fill="#6366f1"/>
  <!-- Eye highlights -->
  <circle cx="47" cy="48" r="2" fill="white"/>
  <circle cx="77" cy="48" r="2" fill="white"/>
  <!-- Mouth -->
  <rect x="45" y="62" width="30" height="4" rx="2" fill="#6366f1"/>
  <!-- Ears -->
  <rect x="20" y="42" width="10" height="18" rx="4" fill="white"/>
  <rect x="90" y="42" width="10" height="18" rx="4" fill="white"/>
  <!-- Body -->
  <rect x="38" y="78" width="44" height="24" rx="8" fill="white" opacity="0.9"/>
  <!-- Body detail -->
  <circle cx="52" cy="90" r="3" fill="#6366f1"/>
  <circle cx="60" cy="90" r="3" fill="#8b5cf6"/>
  <circle cx="68" cy="90" r="3" fill="#a78bfa"/>
</svg>
